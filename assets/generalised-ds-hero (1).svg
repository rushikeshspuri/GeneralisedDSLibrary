<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="70" y1="40" x2="1330" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E14"/>
      <stop offset="0.5" stop-color="#141925"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="accent" x1="300" y1="90" x2="1100" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB347"/>
      <stop offset="0.45" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#B7C0D8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1150" cy="100" r="160" fill="#8B5CF6" opacity="0.07"/>
  <circle cx="1270" cy="390" r="210" fill="#FF6B6B" opacity="0.05"/>

  <g opacity="0.18" stroke="#CAD4E8">
    <path d="M40 390H1360"/>
    <path d="M40 420H1360"/>
    <path d="M80 455H1320"/>
  </g>

  <text x="78" y="118" fill="#98A3BA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">C++17 • TEMPLATES • OOP</text>
  <text x="78" y="190" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="800">GeneralisedDSLibrary</text>
  <text x="80" y="237" fill="#BBC4D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Reusable generic data structures — built to understand, experiment, and reuse.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="286" width="580" height="120" rx="22" fill="#111722" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="112" y="323" fill="#7B86A0" font-family="JetBrains Mono,Consolas,monospace" font-size="18">#include &lt;GeneralisedDS/Stack.hpp&gt;</text>
    <text x="112" y="359" fill="#FFB347" font-family="JetBrains Mono,Consolas,monospace" font-size="20">GeneralisedDS::Stack&lt;</text>
    <text x="388" y="359" fill="#A78BFA" font-family="JetBrains Mono,Consolas,monospace" font-size="20">int</text>
    <text x="425" y="359" fill="#FFB347" font-family="JetBrains Mono,Consolas,monospace" font-size="20">&gt; stack;</text>
    <text x="112" y="389" fill="#B7C0D8" font-family="JetBrains Mono,Consolas,monospace" font-size="18">stack.Push(10);</text>
    <text x="324" y="389" fill="#B7C0D8" font-family="JetBrains Mono,Consolas,monospace" font-size="18">stack.Push(20);</text>
  </g>

  <!-- 3D linked structure -->
  <g transform="translate(770,245)" filter="url(#shadow)">
    <!-- back extrusion -->
    <g opacity="0.28" transform="translate(22,34)">
      <rect x="0" y="0" width="118" height="70" rx="16" fill="#3A4152"/>
      <rect x="160" y="0" width="118" height="70" rx="16" fill="#3A4152"/>
      <rect x="320" y="0" width="118" height="70" rx="16" fill="#3A4152"/>
      <rect x="480" y="0" width="118" height="70" rx="16" fill="#3A4152"/>
    </g>

    <!-- connectors -->
    <path d="M116 35H160" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
    <path d="M276 35H320" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
    <path d="M436 35H480" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>

    <!-- nodes -->
    <g>
      <rect width="118" height="70" rx="16" fill="url(#node)"/>
      <circle cx="31" cy="35" r="10" fill="#FF6B6B"/>
      <text x="50" y="42" fill="#141925" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">10</text>
    </g>
    <g transform="translate(160)">
      <rect width="118" height="70" rx="16" fill="url(#node)"/>
      <circle cx="31" cy="35" r="10" fill="#FFB347"/>
      <text x="50" y="42" fill="#141925" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">20</text>
    </g>
    <g transform="translate(320)">
      <rect width="118" height="70" rx="16" fill="url(#node)"/>
      <circle cx="31" cy="35" r="10" fill="#A78BFA"/>
      <text x="50" y="42" fill="#141925" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">30</text>
    </g>
    <g transform="translate(480)">
      <rect width="118" height="70" rx="16" fill="url(#node)"/>
      <circle cx="31" cy="35" r="10" fill="#60A5FA"/>
      <text x="50" y="42" fill="#141925" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">40</text>
    </g>

    <rect x="170" y="100" width="255" height="44" rx="22" fill="#171D2A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="206" y="129" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">generic • reusable • readable</text>
  </g>
</svg>
